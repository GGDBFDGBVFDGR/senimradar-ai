[project]
name = "senimradar-backend"
version = "0.1.0"
description = "SenimRadar AI API. Stage 1 foundation: validation, health, and an honest unavailable analysis response."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pymysql>=1.1",
  "cryptography>=44",
  "pytest>=8.3",
  "httpx2>=2.16",
  "scikit-learn>=1.6",
  "python-multipart>=0.0.20",
  "pillow>=11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
